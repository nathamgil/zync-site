<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Zync</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>

<!-- Tela de entrada. Cobre o painel inteiro até haver sessão.
     Não é a segurança — a segurança é a RLS no banco. Isto é só
     a porta: sem sessão, o banco não devolveria nada mesmo. -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><svg class="mira" viewBox="0 0 100 100" aria-hidden="true"><g class="seal" fill="none" stroke-width="7" stroke-linecap="round"><path d="M 90.57 60.87 A 42 42 0 0 1 60.87 90.57"/><path d="M 39.13 90.57 A 42 42 0 0 1 9.43 60.87"/><path d="M 9.43 39.13 A 42 42 0 0 1 39.13 9.43"/><path d="M 60.87 9.43 A 42 42 0 0 1 90.57 39.13"/></g><path class="z" d="M31 33 H69 L31 67 H69" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle class="bull" cx="50" cy="50" r="6.5"/></svg><span class="wm"><b>ZYNC</b> <span>painel interno</span></span></div>
    <h2>Entrar</h2>
    <label for="li-mail">E-mail</label>
    <input id="li-mail" type="email" autocomplete="username" required>
    <label for="li-senha">Senha</label>
    <input id="li-senha" type="password" autocomplete="current-password" required>
    <button class="btn pri" id="li-btn" type="submit">Entrar</button>
    <p class="login-erro" id="li-erro" hidden></p>
    <p class="rodape">Acesso restrito à equipe Zync.</p>
  </form>
</div>

<div class="top">
  <div class="brand"><svg class="mira" viewBox="0 0 100 100" aria-hidden="true"><g class="seal" fill="none" stroke-width="7" stroke-linecap="round"><path d="M 90.57 60.87 A 42 42 0 0 1 60.87 90.57"/><path d="M 39.13 90.57 A 42 42 0 0 1 9.43 60.87"/><path d="M 9.43 39.13 A 42 42 0 0 1 39.13 9.43"/><path d="M 60.87 9.43 A 42 42 0 0 1 90.57 39.13"/></g><path class="z" d="M31 33 H69 L31 67 H69" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle class="bull" cx="50" cy="50" r="6.5"/></svg><span class="wm"><b>ZYNC</b> <span>painel interno</span></span></div>
  <div class="sp"></div>
  <span class="quem" id="quem"></span>
  <button class="btn" id="sair" hidden>Sair</button>
</div>

<div class="shell">

  <nav class="lista" aria-label="Clientes">
    <input class="busca" id="busca" type="search" placeholder="Buscar cliente…" aria-label="Buscar cliente">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por situação">
      <button class="fx on" data-f="todos">Todos</button>
      <button class="fx" data-f="cliente">Clientes</button>
      <button class="fx" data-f="proposta">Proposta</button>
      <button class="fx" data-f="prospect">Prospects</button>
      <button class="fx" data-f="perdido">Perdidos</button>
    </div>
    <details class="novo" id="novoCliente">
      <summary>Novo cliente</summary>
      <form class="form" data-f="novo-cliente">
        <div class="par">
          <div><label for="nc-empresa">Empresa</label>
            <input id="nc-empresa" name="empresa" required></div>
        </div>
        <div class="par">
          <div><label for="nc-contato">Contato</label>
            <input id="nc-contato" name="contato_nome"></div>
          <div><label for="nc-papel">Papel</label>
            <input id="nc-papel" name="contato_papel" placeholder="sócio, decisor…"></div>
        </div>
        <div class="par">
          <div><label for="nc-segmento">Segmento</label>
            <input id="nc-segmento" name="segmento"></div>
          <div><label for="nc-cidade">Cidade</label>
            <input id="nc-cidade" name="cidade" placeholder="Cidade / UF"></div>
        </div>
        <div class="par">
          <div><label for="nc-status">Situação</label>
            <select id="nc-status" name="status">
              <option value="prospect">prospect</option>
              <option value="proposta">proposta enviada</option>
              <option value="cliente">cliente</option>
              <option value="pausado">pausado</option>
              <option value="perdido">não fechou</option>
            </select></div>
          <div><label for="nc-desde">Primeiro contato</label>
            <input id="nc-desde" name="desde" type="date"></div>
        </div>
        <div class="par">
          <div><label for="nc-mensal">Mensalidade</label>
            <input id="nc-mensal" name="valor_mensal" type="number" step="0.01" placeholder="R$"></div>
          <div><label for="nc-impl">Implantação</label>
            <input id="nc-impl" name="valor_implantacao" type="number" step="0.01" placeholder="R$"></div>
        </div>
        <div><label for="nc-resumo">Quem são</label>
          <textarea id="nc-resumo" name="resumo" placeholder="O que a empresa é e o que foi descoberto."></textarea></div>
        <div class="linha-btn">
          <button type="submit" class="btn pri mini">Cadastrar</button>
          <span class="msg"></span>
        </div>
      </form>
    </details>

    <div class="clientes" id="clientes"></div>
  </nav>

  <main class="main" id="main"></main>

</div>

<footer>
  Painel interno da Zync · dados que não saem daqui · <span id="rodape"></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../area-cliente/config.js"></script>
<script src="config-admin.js"></script>
<script src="dados-locais.js" onerror="window.__semArquivo=true"></script>
<script src="admin-data.js"></script>
<script>
(function(){
  'use strict';
  var F = ZyncAdmin.Fmt;
  var estado = { clientes: [], filtro: 'todos', busca: '', sel: null, aba: 'visao' };

  var elLista = document.getElementById('clientes');
  var elMain  = document.getElementById('main');

  function esc(s){
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ============================================================
     ESCRITA
     ------------------------------------------------------------
     Toda gravacao vai para o Supabase e a RLS decide. O front
     nunca esconde nada que o banco teria devolvido.
     ============================================================ */
  var FORMS = {}, seq = 0;
  var HOJE = new Date().toISOString().slice(0,10);

  var STATUS = [
    ['prospect','prospect'], ['proposta','proposta enviada'],
    ['cliente','cliente'], ['pausado','pausado'], ['perdido','não fechou']
  ];
  var TIPOS_TL = [
    ['reuniao','reunião'], ['proposta','proposta'], ['fechamento','fechamento'],
    ['perda','perda'], ['pagamento','pagamento'], ['nota','nota']
  ];
  var STATUS_APRES = [
    ['rascunho','rascunho'], ['enviada','enviada'], ['apresentada','apresentada'],
    ['aceita','aceita'], ['recusada','recusada']
  ];

  function opcoes(lista, sel){
    return lista.map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (o[0] === sel ? ' selected' : '') + '>' +
             esc(o[1]) + '</option>';
    }).join('');
  }

  function campo(c){
    var id = 'c' + (++seq);
    var ctrl;
    if(c.tipo === 'select'){
      ctrl = '<select id="' + id + '" name="' + c.k + '">' + opcoes(c.opcoes, c.valor) + '</select>';
    } else if(c.tipo === 'textarea'){
      ctrl = '<textarea id="' + id + '" name="' + c.k + '" placeholder="' + esc(c.ph || '') + '">' +
             esc(c.valor || '') + '</textarea>';
    } else {
      ctrl = '<input id="' + id + '" name="' + c.k + '" type="' + (c.tipo || 'text') + '"' +
             ' value="' + esc(c.valor === undefined ? '' : c.valor) + '"' +
             ' placeholder="' + esc(c.ph || '') + '"' + (c.req ? ' required' : '') +
             (c.tipo === 'number' ? ' step="0.01"' : '') + '>';
    }
    return '<div><label for="' + id + '">' + esc(c.label) + '</label>' + ctrl + '</div>';
  }

  /* linhas = array de arrays de campos; cada array vira uma faixa */
  function formNovo(titulo, linhas, botao, onSalvar){
    var fid = 'f' + (++seq);
    FORMS[fid] = onSalvar;
    return '<details class="novo"><summary>' + esc(titulo) + '</summary>' +
      '<form class="form" data-f="' + fid + '">' +
      linhas.map(function(l){
        return '<div class="par">' + l.map(campo).join('') + '</div>';
      }).join('') +
      '<div class="linha-btn"><button type="submit" class="btn pri mini">' + esc(botao) + '</button>' +
      '<span class="msg"></span></div></form></details>';
  }

  function ligaForms(raiz){
    Array.prototype.forEach.call(raiz.querySelectorAll('form.form'), function(f){
      if(f.dataset.ligado) return;
      f.dataset.ligado = '1';
      f.addEventListener('submit', function(e){
        e.preventDefault();
        var acao = FORMS[f.dataset.f];
        if(!acao) return;
        var dados = {};
        Array.prototype.forEach.call(f.querySelectorAll('input,select,textarea'), function(i){
          if(!i.name) return;
          var v = String(i.value || '').trim();
          dados[i.name] = v === '' ? null : v;
        });
        var msg = f.querySelector('.msg');
        msg.className = 'msg'; msg.textContent = 'Salvando…';
        f.classList.add('salvando');
        Promise.resolve(acao(dados)).then(function(r){
          f.classList.remove('salvando');
          if(!r || !r.ok){
            msg.className = 'msg erro';
            msg.textContent = (r && r.erro) || 'Não foi possível gravar.';
            return;
          }
          msg.className = 'msg ok'; msg.textContent = 'Salvo.';
          f.reset();
          recarregar();
        });
      });
    });
  }

  /* recarrega do banco preservando onde voce estava */
  function recarregar(){
    var sel = estado.sel, aba = estado.aba;
    return carregar().then(function(){
      estado.sel = sel; estado.aba = aba;
      pintaLista(); pintaMain();
    });
  }

  function idDoSel(){
    var c = achado();
    return c ? c.id : null;
  }

  /* ---------- lista lateral ---------- */
  function visiveis(){
    var q = estado.busca.trim().toLowerCase();
    return estado.clientes.filter(function(c){
      if(estado.filtro !== 'todos' && c.status !== estado.filtro) return false;
      if(!q) return true;
      return (c.empresa + ' ' + c.contato_nome + ' ' + c.segmento + ' ' + c.cidade)
             .toLowerCase().indexOf(q) > -1;
    });
  }

  function pintaLista(){
    var lista = visiveis();
    if(!lista.length){
      elLista.innerHTML = '<p class="vazio">Nenhum cliente com esse filtro.</p>';
      return;
    }
    elLista.innerHTML = lista.map(function(c){
      var val = c.status === 'cliente' && c.valor_mensal
        ? F.brl(c.valor_mensal) : '';
      return '<button class="ci' + (estado.sel === c.slug ? ' on' : '') + '" data-s="' + esc(c.slug) + '">' +
        '<span class="faixa f-' + esc(c.status) + '"></span>' +
        '<span class="txt">' +
          '<span class="nome">' + esc(c.empresa) + '</span>' +
          '<span class="sub">' + esc(ZyncAdmin.rotuloStatus(c.status)) +
            (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>' +
        '</span>' +
        '<span class="val nums">' + val + '</span>' +
      '</button>';
    }).join('');
    Array.prototype.forEach.call(elLista.querySelectorAll('.ci'), function(b){
      b.addEventListener('click', function(){
        estado.sel = b.dataset.s; estado.aba = 'visao';
        pintaLista(); pintaMain();
        if(window.innerWidth <= 900) elMain.scrollIntoView({behavior:'smooth'});
      });
    });
  }

  /* ---------- detalhe ---------- */
  function achado(){
    return estado.clientes.filter(function(c){ return c.slug === estado.sel; })[0];
  }

  function blocoVisao(c){
    var h = '';
    if(c.resumo) h += '<div class="bloco"><h3>Quem são</h3><p>' + esc(c.resumo) + '</p></div>';
    h += '<div class="bloco"><h3>Ficha</h3><dl class="dl">' +
      linha('Contato', c.contato_nome ? c.contato_nome + (c.contato_papel ? ' — ' + c.contato_papel : '') : '') +
      linha('Segmento', c.segmento) +
      linha('Cidade', c.cidade) +
      linha('Situação', ZyncAdmin.rotuloStatus(c.status)) +
      linha(c.status === 'cliente' ? 'Cliente desde' : 'Primeiro contato', F.data(c.desde)) +
      linha('Mensalidade', c.valor_mensal ? F.brl(c.valor_mensal) : '') +
      linha('Implantação', c.valor_implantacao ? F.brl(c.valor_implantacao) : '') +
    '</dl></div>';

    h += '<div class="bloco"><h3>Próximo passo</h3>';
    if(!c.passos.length){
      h += '<p>Nada pendente registrado.</p>';
    } else {
      h += c.passos.map(function(p,i){
        var tarde = !p.feito && F.atrasado(p.prazo);
        return '<div class="passo' + (p.feito ? ' ok' : '') + '">' +
          '<input type="checkbox" data-passo="' + esc(p.id) + '"' + (p.feito ? ' checked' : '') +
            ' aria-label="Concluir: ' + esc(p.texto) + '">' +
          '<span class="p">' + esc(p.texto) + '</span>' +
          '<span class="prazo nums' + (tarde ? ' tarde' : '') + '">' +
            (p.prazo ? F.dataCurta(p.prazo) + (tarde ? ' · atrasado' : '') : '') + '</span>' +
          '<button class="apagar" data-apagar-passo="' + esc(p.id) + '" title="Apagar" ' +
            'aria-label="Apagar: ' + esc(p.texto) + '">&times;</button>' +
        '</div>';
      }).join('');
    }
    h += formNovo('Nova pendência', [
      [{k:'texto', label:'O que falta', req:true, ph:'Retomar contato, cobrar assinatura…'},
       {k:'prazo', label:'Prazo', tipo:'date'}]
    ], 'Adicionar', function(d){
      d.cliente_id = idDoSel(); d.feito = false;
      return ZyncAdmin.inserir('crm_passos', d);
    });
    h += '</div>';
    return h;
  }

  function linha(k, v){
    if(!v || v === '—') return '';
    return '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>';
  }

  function formReuniao(){
    return formNovo('Registrar reunião', [
      [{k:'data', label:'Data', tipo:'date', valor:HOJE, req:true},
       {k:'titulo', label:'Título', req:true, ph:'Diagnóstico, apresentação…'}],
      [{k:'participantes_txt', label:'Participantes', ph:'Natham, Daniel, cliente'}],
      [{k:'resumo', label:'Resumo', tipo:'textarea', ph:'O que ficou decidido.'}],
      [{k:'notas_url', label:'Anotações no Drive', ph:'https://docs.google.com/…'},
       {k:'gravacao_url', label:'Gravação', ph:'https://drive.google.com/…'}]
    ], 'Registrar', function(d){
      d.cliente_id = idDoSel();
      d.participantes = d.participantes_txt
        ? d.participantes_txt.split(',').map(function(x){ return x.trim(); }).filter(Boolean)
        : null;
      delete d.participantes_txt;
      return ZyncAdmin.inserir('crm_reunioes', d);
    });
  }

  function blocoReunioes(c){
    if(!c.reunioes.length) return formReuniao() +
      '<div class="bloco"><p>Nenhuma reunião registrada ainda.</p></div>';
    return formReuniao() + c.reunioes.map(function(r, i){
      var pontos = (r.pontos || []).map(function(p){
        return '<li><span class="tm">' + esc(p.t || '') + '</span><span>' + esc(p.texto) + '</span></li>';
      }).join('');
      var links = '';
      if(r.notas_url)    links += '<a class="btn" href="' + esc(r.notas_url) + '" target="_blank" rel="noopener">Anotações no Drive</a>';
      if(r.gravacao_url) links += '<a class="btn" href="' + esc(r.gravacao_url) + '" target="_blank" rel="noopener">Gravação</a>';
      return '<details class="reu"' + (i === 0 ? ' open' : '') + '>' +
        '<summary><span class="d nums">' + F.data(r.data) + '</span>' +
          '<span class="t">' + esc(r.titulo) + '</span>' +
          '<span class="who">' + esc((r.participantes || []).join(', ')) + '</span></summary>' +
        '<div class="corpo">' +
          (r.resumo ? '<p>' + esc(r.resumo) + '</p>' : '') +
          (pontos ? '<div class="rot">o que foi dito</div><ul class="pontos">' + pontos + '</ul>' : '') +
          (links ? '<div class="links">' + links + '</div>' : '') +
        '</div></details>';
    }).join('');
  }

  function formApres(){
    return formNovo('Registrar apresentação', [
      [{k:'titulo', label:'Título', req:true, ph:'Proposta de site, plano de crescimento…'},
       {k:'data', label:'Data', tipo:'date', valor:HOJE}],
      [{k:'status', label:'Situação', tipo:'select', opcoes:STATUS_APRES, valor:'apresentada'},
       {k:'url_publica', label:'Link público', ph:'https://zynchub.com.br/proposta/…'}],
      [{k:'caminho', label:'Arquivo no repositório', ph:'cliente/apresentacao-zync-cliente.html'}]
    ], 'Registrar', function(d){
      d.cliente_id = idDoSel();
      return ZyncAdmin.inserir('crm_apresentacoes', d);
    });
  }

  function blocoApres(c){
    if(!c.apresentacoes.length) return formApres() +
      '<div class="bloco"><p>Nenhuma apresentação registrada.</p></div>';
    return formApres() + '<div class="aps">' + c.apresentacoes.map(function(a){
      var acao = '';
      if(a.url_publica) acao += '<a class="btn pri" href="' + esc(a.url_publica) + '" target="_blank" rel="noopener">Abrir</a>' +
        '<button class="btn" data-copiar="' + esc(a.url_publica) + '">Copiar link</button>';
      return '<div class="ap">' +
        '<span class="t">' + esc(a.titulo) + '</span>' +
        '<span class="st st-' + (a.status === 'aceita' ? 'cliente' : a.status === 'recusada' ? 'perdido' : 'proposta') + '">' + esc(a.status) + '</span>' +
        '<span class="m nums">' + F.data(a.data) + (a.caminho ? ' · ' + esc(a.caminho) : '') + '</span>' +
        '<span class="acao">' + acao + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function formTimeline(){
    return formNovo('Registrar no histórico', [
      [{k:'data', label:'Data', tipo:'date', valor:HOJE, req:true},
       {k:'tipo', label:'Tipo', tipo:'select', opcoes:TIPOS_TL, valor:'nota'}],
      [{k:'texto', label:'O que aconteceu', req:true, ph:'Cliente pediu prazo até sexta.'}]
    ], 'Registrar', function(d){
      d.cliente_id = idDoSel();
      return ZyncAdmin.inserir('crm_timeline', d);
    });
  }

  function blocoTimeline(c){
    if(!c.timeline.length) return formTimeline() +
      '<div class="bloco"><p>Sem histórico registrado.</p></div>';
    var pre = formTimeline();
    var cor = { reuniao:'var(--info)', proposta:'var(--sand)', fechamento:'var(--ok)',
                perda:'var(--bad)', pagamento:'var(--ok)', nota:'var(--dim)' };
    return pre + '<ul class="tl">' + c.timeline.map(function(t){
      return '<li>' +
        '<span class="d nums">' + F.data(t.data) + '</span>' +
        '<span class="eixo"><span class="pt" style="background:' + (cor[t.tipo] || 'var(--dim)') + '"></span></span>' +
        '<span class="txt"><b>' + esc(t.tipo) + '</b>' + esc(t.texto) + '</span>' +
      '</li>';
    }).join('') + '</ul>';
  }

  function pintaMain(){
    var c = achado();
    if(!c){
      elMain.innerHTML = '<div class="bloco"><h3>Selecione um cliente</h3>' +
        '<p>' + estado.clientes.length + ' no painel. A lista começa por quem tem proposta em aberto.</p></div>';
      return;
    }
    var abas = [
      ['visao','Visão geral', ''],
      ['reunioes','Reuniões', c.reunioes.length],
      ['apres','Apresentações', c.apresentacoes.length],
      ['tl','Histórico', c.timeline.length]
    ];

    elMain.innerHTML =
      '<div class="cab"><div>' +
        '<h1>' + esc(c.empresa) + '</h1>' +
        '<div class="meta">' + esc(c.segmento || '—') + (c.cidade ? ' · ' + esc(c.cidade) : '') + '</div>' +
      '</div><div class="dir">' +
        '<select class="selstatus" id="selStatus" aria-label="Situação do cliente">' +
          opcoes(STATUS, c.status) + '</select>' +
      '</div></div>' +

      '<div class="kpis">' +
        kpi('Mensalidade', c.valor_mensal ? F.brl(c.valor_mensal) : '—') +
        kpi('Implantação', c.valor_implantacao ? F.brl(c.valor_implantacao) : '—') +
        kpi('Reuniões', String(c.reunioes.length)) +
        kpi('Pendências', String(c.passos.filter(function(p){return !p.feito;}).length)) +
      '</div>' +

      '<div class="abas" role="tablist">' + abas.map(function(a){
        return '<button class="aba' + (estado.aba === a[0] ? ' on' : '') + '" data-a="' + a[0] + '" role="tab">' +
          a[1] + (a[2] !== '' ? '<span class="n">' + a[2] + '</span>' : '') + '</button>';
      }).join('') + '</div>' +

      '<div class="painel' + (estado.aba==='visao'?' on':'') + '" data-p="visao">' + blocoVisao(c) + '</div>' +
      '<div class="painel' + (estado.aba==='reunioes'?' on':'') + '" data-p="reunioes">' + blocoReunioes(c) + '</div>' +
      '<div class="painel' + (estado.aba==='apres'?' on':'') + '" data-p="apres">' + blocoApres(c) + '</div>' +
      '<div class="painel' + (estado.aba==='tl'?' on':'') + '" data-p="tl">' + blocoTimeline(c) + '</div>';

    Array.prototype.forEach.call(elMain.querySelectorAll('.aba'), function(b){
      b.addEventListener('click', function(){ estado.aba = b.dataset.a; pintaMain(); });
    });
    Array.prototype.forEach.call(elMain.querySelectorAll('[data-copiar]'), function(b){
      b.addEventListener('click', function(){
        navigator.clipboard.writeText(b.dataset.copiar).then(function(){
          var t = b.textContent; b.textContent = 'Copiado';
          setTimeout(function(){ b.textContent = t; }, 1600);
        });
      });
    });
    ligaForms(elMain);

    /* concluir / reabrir pendência — grava na hora */
    Array.prototype.forEach.call(elMain.querySelectorAll('[data-passo]'), function(i){
      i.addEventListener('change', function(){
        var linha = i.closest('.passo');
        linha.classList.add('salvando');
        ZyncAdmin.atualizar('crm_passos', i.dataset.passo, { feito: i.checked })
          .then(function(r){
            linha.classList.remove('salvando');
            if(!r.ok){ i.checked = !i.checked; alert(r.erro); return; }
            recarregar();
          });
      });
    });

    /* apagar pendência */
    Array.prototype.forEach.call(elMain.querySelectorAll('[data-apagar-passo]'), function(b){
      b.addEventListener('click', function(){
        var linha = b.closest('.passo');
        var texto = linha.querySelector('.p').textContent;
        if(!confirm('Apagar a pendência "' + texto + '"?')) return;
        linha.classList.add('salvando');
        ZyncAdmin.remover('crm_passos', b.dataset.apagarPasso).then(function(r){
          linha.classList.remove('salvando');
          if(!r.ok){ alert(r.erro); return; }
          recarregar();
        });
      });
    });

    /* mudar a situação do cliente — a ação central do funil */
    var sel = document.getElementById('selStatus');
    if(sel){
      sel.addEventListener('change', function(){
        var antes = c.status;
        sel.disabled = true;
        ZyncAdmin.atualizar('crm_clientes', c.id, { status: sel.value }).then(function(r){
          sel.disabled = false;
          if(!r.ok){ sel.value = antes; alert(r.erro); return; }
          recarregar();
        });
      });
    }
  }

  function kpi(k, v){
    return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v nums">' + v + '</div></div>';
  }

  /* ---------- avisos de estado ---------- */
  function avisar(res){
    var m = {
      'sem-arquivo': ['O painel está vazio porque o arquivo local não existe',
        'O modo <code>local</code> lê <code>admin/dados-locais.js</code>, que fica de fora do repositório de propósito — ele carrega dossiê de cliente e não pode ir para um repositório público. Peça ao Claude para gerar o arquivo a partir da memória dele.'],
      'sem-credencial': ['Supabase ainda não configurado',
        'Preencha <code>supabaseUrl</code> e <code>supabaseAnonKey</code> em <code>area-cliente/config.js</code>. Passo a passo em <code>zync-docs/SETUP-ADMIN.md</code>.'],
      'sem-sdk': ['A biblioteca do Supabase não carregou',
        'Verifique a conexão e recarregue a página.'],
      'sem-sessao': ['Você não está autenticado',
        'Entre pela Área do Cliente com a sua conta da Zync e volte para cá.'],
      'sem-admin': ['Sua conta não está na lista de admins',
        'O banco devolveu vazio porque a policy negou, não porque a tela escondeu. Rode o <code>insert into admins</code> da seção 3 do <code>SETUP-ADMIN.md</code>.'],
      'erro': ['Erro ao carregar', esc(res.detalhe || 'Motivo não informado pelo servidor.')],
    }[res.motivo] || ['Não foi possível carregar', 'Motivo desconhecido.'];

    elMain.innerHTML = '<div class="aviso"><h3>' + m[0] + '</h3><p>' + m[1] + '</p></div>';
  }

  /* ---------- eventos globais ---------- */
  document.getElementById('busca').addEventListener('input', function(){
    estado.busca = this.value; pintaLista();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.fx'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.fx'), function(o){ o.classList.remove('on'); });
      b.classList.add('on'); estado.filtro = b.dataset.f; pintaLista();
    });
  });

  /* ---------- novo cliente ---------- */
  (function(){
    var f = document.querySelector('form[data-f="novo-cliente"]');
    if(!f) return;
    FORMS['novo-cliente'] = function(d){
      /* slug vem da empresa: minúsculas, sem acento, hífen no lugar de espaço */
      d.slug = String(d.empresa || '')
        .toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60);
      if(!d.slug) return Promise.resolve({ ok:false, erro:'Informe o nome da empresa.' });
      return ZyncAdmin.inserir('crm_clientes', d).then(function(r){
        if(r.ok && r.linha) estado.sel = r.linha.slug;
        return r;
      });
    };
    ligaForms(document.getElementById('novoCliente'));
  })();

  /* ---------- carga ---------- */
  document.getElementById('rodape').textContent = 'modo ' + ZyncAdmin.modo;

  function carregar(){
    return ZyncAdmin.carregar().then(function(res){
      /* sem sessão não é erro: é a hora de pedir login */
      if(!res.ok && res.motivo === 'sem-sessao'){ mostraLogin(); return; }
      escondeLogin();
      if(!res.ok){ avisar(res); return; }
      estado.clientes = res.clientes;
      var fechados = res.clientes.filter(function(c){ return c.status === 'cliente'; });
      var mrr = fechados.reduce(function(s,c){ return s + (Number(c.valor_mensal) || 0); }, 0);
      document.getElementById('quem').textContent =
        res.clientes.length + ' no funil · ' + fechados.length + ' ativos · ' + F.brl(mrr) + '/mês';
      pintaLista(); pintaMain();
    });
  }

  /* ---------- login ---------- */
  var elLogin = document.getElementById('login');
  var elSair  = document.getElementById('sair');

  function mostraLogin(){
    elLogin.hidden = false; elSair.hidden = true;
    document.getElementById('li-mail').focus();
  }
  function escondeLogin(){
    elLogin.hidden = true;
    elSair.hidden = (ZyncAdmin.modo !== 'supabase');
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('li-btn'), erro = document.getElementById('li-erro');
    erro.hidden = true; btn.disabled = true; btn.textContent = 'Entrando…';
    ZyncAdmin.entrar(
      document.getElementById('li-mail').value,
      document.getElementById('li-senha').value
    ).then(function(r){
      btn.disabled = false; btn.textContent = 'Entrar';
      if(!r.ok){ erro.textContent = r.msg; erro.hidden = false; return; }
      document.getElementById('li-senha').value = '';
      carregar();
    });
  });

  elSair.addEventListener('click', function(){
    ZyncAdmin.sair().then(function(){ location.reload(); });
  });

  carregar();
})();
</script>

</body>
</html>
